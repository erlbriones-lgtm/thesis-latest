<!-- Header / Navbar -->
<header class="bg-gradient-to-r from-bisu-blue via-[#180058] to-bisu-blue-dark text-white shadow-md sticky top-0 z-50 border-b border-white/10">
    <div class="w-full px-4 sm:px-6 md:px-8 lg:px-10 xl:px-12 py-2.5">
        <!-- Desktop Layout -->
        <div class="hidden sm:flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <div class="flex items-center space-x-3 shrink-0">
                    <img src="images/BISU.webp" alt="BISU Logo" class="w-9 h-9 object-contain hover:scale-105 transition-transform" title="BISU Logo" width="36" height="36">
                    <img src="images/BAGONG-PILIPINAS-LOGO-1-1.webp" alt="Bagong Pilipinas" class="w-11 h-11 object-contain hover:scale-105 transition-transform" title="Bagong Pilipinas" width="44" height="44">
                    <img src="images/images.webp" alt="TUV Rheinland" class="w-11 h-11 object-contain rounded hover:scale-105 transition-transform" title="TUV Rheinland" width="44" height="44">
                </div>
                <div>
                    <h1 class="text-base md:text-lg font-extrabold tracking-tight leading-tight bg-gradient-to-r from-white to-slate-200 bg-clip-text text-transparent">Bohol Island State University</h1>
                    <p id="t-header-sub" class="text-[11px] md:text-xs text-blue-200/90 font-medium">Calape Campus &bull; Customer Satisfaction Feedback</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <div class="relative">
                    <select id="language-selector" class="bg-white hover:bg-slate-50 text-black text-xs md:text-sm font-bold px-3.5 py-1.5 rounded-full border border-slate-300 outline-none focus:ring-2 focus:ring-bisu-gold/50 cursor-pointer transition-all shadow-sm">
                        <option value="en" class="text-black bg-white font-medium">English</option>
                        <option value="tl" class="text-black bg-white font-medium">Tagalog</option>
                        <option value="ceb" class="text-black bg-white font-medium">Bisaya</option>
                    </select>
                </div>
                <button id="admin-login-btn" class="w-9 h-9 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 border border-white/10 text-white hover:text-bisu-gold transition-all shadow-sm" title="Admin Access">
                    <i class="fa-solid fa-lock text-sm"></i>
                </button>
            </div>
        </div>

        <!-- Mobile Layout -->
        <div class="flex sm:hidden flex-col gap-2">
            <div class="flex items-center justify-between w-full">
                <div class="flex items-center space-x-2.5">
                    <div class="flex items-center space-x-2 shrink-0">
                        <img src="images/BISU.webp" alt="BISU Logo" class="w-7 h-7 object-contain" width="28" height="28">
                        <img src="images/BAGONG-PILIPINAS-LOGO-1-1.webp" alt="Bagong Pilipinas" class="w-8 h-8 object-contain" width="32" height="32">
                        <img src="images/images.webp" alt="TUV Rheinland" class="w-8 h-8 object-contain rounded" width="32" height="32">
                    </div>
                    <div class="flex flex-col">
                        <h1 class="text-xs font-black tracking-tight leading-none text-white">BISU Calape</h1>
                        <p class="text-[9px] text-blue-200/95 font-semibold mt-0.5">Satisfaction Survey</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <select id="language-selector-mobile" class="bg-white hover:bg-slate-50 text-black text-[11px] font-bold px-2.5 py-1 rounded-full border border-slate-300 outline-none cursor-pointer transition-all shadow-sm">
                        <option value="en" class="text-black bg-white font-medium">English</option>
                        <option value="tl" class="text-black bg-white font-medium">Tagalog</option>
                        <option value="ceb" class="text-black bg-white font-medium">Bisaya</option>
                    </select>
                    <button id="admin-login-btn-mobile" class="w-7 h-7 flex items-center justify-center rounded-full bg-white/10 text-white/90 hover:text-bisu-gold transition-colors border border-white/20" title="Admin Access">
                        <i class="fa-solid fa-lock text-[10px]"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!-- Seamless Accent Gradient Bar -->
    <div class="h-0.5 bg-gradient-to-r from-bisu-red via-bisu-gold to-bisu-blue"></div>
</header>
