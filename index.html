    <title>BISU Calape - Feedback System</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bisu-blue': '#22007c', /* Deep Royal/Navy Blue from logo text ring */
                        'bisu-blue-dark': '#180058', /* Darker variant for professional hovers */
                        'bisu-gold': '#ffd500', /* Vibrant Gold from outer ring */
                        'bisu-gold-dark': '#cca600', /* Darker gold for professional hovers */
                        'bisu-red': '#E84A1C',   /* Orange-Red from the torch flame */
                        'bisu-green': '#0E811B'  /* Green from the island */
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
